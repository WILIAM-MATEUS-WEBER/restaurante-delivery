<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RestaurantOS{% endblock %} — Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --accent: #ff4d1c;
      --accent2: #ffb347;
      --text: #f0ece4;
      --muted: #888;
      --success: #22c55e;
      --info: #3b82f6;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    /* ── NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; gap: 2rem;
      height: 64px; position: sticky; top: 0; z-index: 100;
    }
    .nav-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1.25rem;
      color: var(--accent); text-decoration: none;
      display: flex; align-items: center; gap: .5rem;
    }
    .nav-brand span { color: var(--text); }
    nav a { color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 500;
             transition: color .2s; padding: .25rem 0; }
    nav a:hover, nav a.active { color: var(--text); }
    nav a.active { border-bottom: 2px solid var(--accent); }
    .nav-spacer { flex: 1; }
    .nav-badge {
      background: var(--accent); color: #fff;
      font-size: .7rem; font-weight: 700; font-family: 'Syne', sans-serif;
      padding: .2rem .6rem; border-radius: 999px; letter-spacing: .05em;
    }

    /* ── LAYOUT ── */
    main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem; }
    h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 2rem; margin-bottom: 1.5rem; }
    h2 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.3rem; margin-bottom: 1rem; }

    /* ── CARDS ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem;
    }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .55rem 1.2rem; border-radius: 8px; border: none;
      font-family: 'DM Sans', sans-serif; font-size: .875rem; font-weight: 500;
      cursor: pointer; text-decoration: none; transition: all .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #e03a10; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--muted); }
    .btn-sm { padding: .35rem .8rem; font-size: .8rem; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; }
    .btn-danger:hover { background: #991b1b; }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    thead th {
      text-align: left; padding: .75rem 1rem;
      font-family: 'Syne', sans-serif; font-size: .75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    tbody td { padding: .85rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    /* ── FORM ── */
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: .8rem; font-weight: 500; color: var(--muted); margin-bottom: .4rem; }
    input, textarea, select {
      width: 100%; padding: .65rem .9rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .9rem;
      transition: border-color .15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* ── BADGE / STATUS ── */
    .badge {
      display: inline-block; padding: .25rem .7rem;
      border-radius: 999px; font-size: .75rem; font-weight: 600;
    }
    .badge-recebido   { background: #1e3a5f; color: #60a5fa; }
    .badge-preparo    { background: #451a03; color: #fb923c; }
    .badge-saiu       { background: #14532d; color: #4ade80; }
    .badge-entregue   { background: #1a1a1a; color: var(--muted); }
    .badge-cancelado  { background: #450a0a; color: #f87171; }
    .badge-disponivel { background: #14532d; color: #4ade80; }
    .badge-indisponivel { background: #450a0a; color: #f87171; }

    /* ── FLASH MESSAGES ── */
    .flash { padding: .85rem 1.2rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: .9rem; }
    .flash-success { background: #14532d; border: 1px solid #166534; color: #bbf7d0; }
    .flash-info    { background: #1e3a5f; border: 1px solid #1d4ed8; color: #bfdbfe; }
    .flash-error   { background: #450a0a; border: 1px solid #991b1b; color: #fecaca; }

    /* ── TOP BAR ── */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .page-header h1 { margin-bottom: 0; }

    /* ── STAT CARDS (dashboard) ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; }
    .stat-label { font-size: .8rem; color: var(--muted); margin-top: .25rem; }
    .stat-accent { color: var(--accent); }
    .stat-green  { color: var(--success); }
    .stat-blue   { color: var(--info); }
    .stat-yellow { color: var(--warning); }

    /* ── CHECKBOX ── */
    .check-row { display: flex; align-items: center; gap: .6rem; }
    .check-row input[type=checkbox] { width: auto; accent-color: var(--accent); }

    /* ── ITEM LIST (pedido) ── */
    .item-row { display: grid; grid-template-columns: 1fr 80px 80px 32px; gap: .5rem; align-items: center; margin-bottom: .5rem; }
    .remove-item { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; }
    .remove-item:hover { color: var(--accent); }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 4rem; color: var(--muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">🍔 <span>Restaurant</span>OS</a>
  <a href="/produtos" {% if request.path.startswith('/produtos') %}class="active"{% endif %}>Cardápio</a>
  <a href="/clientes" {% if request.path.startswith('/clientes') %}class="active"{% endif %}>Clientes</a>
  <a href="/pedidos"  {% if request.path.startswith('/pedidos')  %}class="active"{% endif %}>Pedidos</a>
  <a href="/api/produtos" target="_blank" style="font-size:.78rem">API</a>
  <div class="nav-spacer"></div>
  <span class="nav-badge">DELIVERY</span>
</nav>

<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

</body>
</html>
